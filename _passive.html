   <script>
    // DOM4 标准
    // addEventListener(eventType, handler, capture || options{});

    window.addEventListener('touchstart', function (e) {
      console.log(e.cancelable);
      e.preventDefault();
      /*
        touchstart 的默认行为是 scroll 触发滚动
        当监听 touchstart 事件时执行了某些操作
        浏览器会等待 JS 执行完毕后再执行默认行为
        从而在执行事件处理函数内部代码时会导致，浪费等待的时间，导致 scroll 的卡顿
        所以通过设置 passive 浏览器就知道它不会阻止默认行为
        因此可以立即执行默认行为，而不必等待 JS 执行完毕
      */
      console.log(123);
      console.log(e.defaultPrevented);
    }, {
      /*
        在移动设备上
        使用 passive touchstart 事件可以提高网站的响应速度和性能
        它会通过两个线程去处理滚动的问题
        1. 处理器程序的执行
        2. 执行默认行为
      */
      passive: true
    })
   </script>
